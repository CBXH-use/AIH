name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $expected = "v" + (node -p "require('./package.json').version")
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version $expected"
          }
          Write-Host "OK: $expected"

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer and portable zip
        run: npm run dist

      - name: Show artifacts
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Verify artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter 'AIH-*-setup.exe' -ErrorAction SilentlyContinue
          $zip = Get-ChildItem release -Filter 'AIH-*-win-x64.zip' -ErrorAction SilentlyContinue
          if (-not $exe -or $exe.Length -lt 50MB) { throw 'installer missing or unexpectedly small' }
          if (-not $zip -or $zip.Length -lt 50MB) { throw 'portable zip missing or unexpectedly small' }
          Write-Host "OK: $($exe.Name) ($([math]::Round($exe.Length/1MB)) MB), $($zip.Name) ($([math]::Round($zip.Length/1MB)) MB)"

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter 'AIH-*' | Where-Object { $_.Name -match '\.(exe|zip)$' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding utf8
          Get-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/AIH-*-setup.exe
            release/AIH-*-win-x64.zip
            release/SHA256SUMS.txt
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: false
          generate_release_notes: true
